<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" fill="none">
  <style>
    .layer { rx: 10; }
    .layer-tokens { fill: #F0EDE8; stroke: #D8D4CD; stroke-width: 1; }
    .layer-chassis { fill: #EDEAE5; stroke: #D8D4CD; stroke-width: 1; }
    .layer-features { fill: #F0EDE8; stroke: #D8D4CD; stroke-width: 1; }
    .folder { fill: #FAFAF8; stroke: #D8D4CD; stroke-width: 1; rx: 6; }
    .layer-title { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .layer-desc { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: #999; }
    .folder-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; fill: #666; }
    .arrow { stroke: #ccc; stroke-width: 1.2; fill: none; marker-end: url(#arr); }
    .note { font-family: Inter, system-ui, sans-serif; font-size: 10.5px; fill: #aaa; font-style: italic; }
    .badge { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: #fff; font-weight: 600; }
    .badge-bg-new { fill: #1A1A1A; rx: 8; }
    .step { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: #1A1A1A; font-weight: 600; letter-spacing: 0.5px; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#ccc"/>
    </marker>
  </defs>

  <!-- Step 1: Tokens -->
  <text class="step" x="40" y="28">STEP 1</text>
  <rect class="layer layer-tokens" x="40" y="36" width="820" height="72"/>
  <rect class="badge-bg-new" x="60" y="46" width="36" height="16"/>
  <text class="badge" x="66" y="58">NEW</text>
  <text class="layer-title" x="104" y="58">tokens/</text>
  <text class="layer-desc" x="170" y="58">Single source of truth — consumed by both Chakra theme and shadcn CSS variables</text>

  <rect class="folder" x="60" y="72" width="85" height="26"/>
  <text class="folder-text" x="72" y="89">colors.ts</text>

  <rect class="folder" x="153" y="72" width="90" height="26"/>
  <text class="folder-text" x="165" y="89">spacing.ts</text>

  <rect class="folder" x="251" y="72" width="110" height="26"/>
  <text class="folder-text" x="263" y="89">typography.ts</text>

  <rect class="folder" x="369" y="72" width="85" height="26"/>
  <text class="folder-text" x="381" y="89">radius.ts</text>

  <line class="arrow" x1="450" y1="108" x2="450" y2="130"/>

  <!-- Step 2: Chassis -->
  <text class="step" x="40" y="144">STEP 2</text>
  <rect class="layer layer-chassis" x="40" y="152" width="820" height="72"/>
  <rect class="badge-bg-new" x="60" y="162" width="36" height="16"/>
  <text class="badge" x="66" y="174">NEW</text>
  <text class="layer-title" x="104" y="174">chassis/</text>
  <text class="layer-desc" x="172" y="174">5 shared controls extracted into framework-agnostic modules</text>

  <rect class="folder" x="60" y="188" width="120" height="26"/>
  <text class="folder-text" x="72" y="205">global-search/</text>

  <rect class="folder" x="188" y="188" width="140" height="26"/>
  <text class="folder-text" x="200" y="205">access-mgmt/</text>

  <rect class="folder" x="336" y="188" width="100" height="26"/>
  <text class="folder-text" x="348" y="205">app-menu/</text>

  <rect class="folder" x="444" y="188" width="120" height="26"/>
  <text class="folder-text" x="456" y="205">rep-code/</text>

  <rect class="folder" x="572" y="188" width="140" height="26"/>
  <text class="folder-text" x="584" y="205">account-context/</text>

  <line class="arrow" x1="450" y1="224" x2="450" y2="246"/>

  <!-- Step 3: Features -->
  <text class="step" x="40" y="260">STEP 3</text>
  <rect class="layer layer-features" x="40" y="268" width="820" height="72"/>
  <rect class="badge-bg-new" x="60" y="278" width="36" height="16"/>
  <text class="badge" x="66" y="290">NEW</text>
  <text class="layer-title" x="104" y="290">features/</text>
  <text class="layer-desc" x="178" y="290">Shared business logic — hooks, contexts, types</text>

  <rect class="folder" x="60" y="306" width="95" height="26"/>
  <text class="folder-text" x="72" y="323">accounts/</text>

  <rect class="folder" x="163" y="306" width="80" height="26"/>
  <text class="folder-text" x="175" y="323">billing/</text>

  <rect class="folder" x="251" y="306" width="80" height="26"/>
  <text class="folder-text" x="263" y="323">trading/</text>

  <rect class="folder" x="339" y="306" width="105" height="26"/>
  <text class="folder-text" x="351" y="323">onboarding/</text>

  <text class="note" x="460" y="323">hooks/, contexts/, types/ per domain</text>
</svg>
