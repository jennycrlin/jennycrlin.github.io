<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#999"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="12" fill="#fafafa"/>

  <!-- Title -->
  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#999" letter-spacing="2">FUTURE STATE — DTF PHASE 1</text>

  <!-- Left: Data Sources -->
  <text x="80" y="90" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#999" text-anchor="middle" letter-spacing="1">DATA SOURCES</text>

  <rect x="20" y="108" width="120" height="36" rx="6" fill="white" stroke="#d4d4d4"/>
  <text x="80" y="131" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">Lilly Ontology</text>

  <rect x="20" y="156" width="120" height="36" rx="6" fill="white" stroke="#d4d4d4"/>
  <text x="80" y="179" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">USDM 4.0</text>

  <rect x="20" y="204" width="120" height="36" rx="6" fill="white" stroke="#d4d4d4"/>
  <text x="80" y="227" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">Lab Reference</text>

  <!-- Arrows: Sources → Design Studio -->
  <line x1="140" y1="126" x2="240" y2="190" stroke="#999" marker-end="url(#arr)"/>
  <line x1="140" y1="174" x2="240" y2="190" stroke="#999" marker-end="url(#arr)"/>
  <line x1="140" y1="222" x2="240" y2="195" stroke="#999" marker-end="url(#arr)"/>

  <!-- Center: Design Studio (main authoring) -->
  <rect x="248" y="130" width="260" height="140" rx="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="378" y="165" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">Design Studio</text>
  <line x1="278" y1="178" x2="478" y2="178" stroke="#e5e5e5"/>
  <text x="378" y="200" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">SoA Data Input</text>
  <text x="378" y="218" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">Standard Lab Activity Codes</text>
  <text x="378" y="236" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">Versioned &amp; Aligned</text>
  <text x="378" y="254" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">Submit to SDR</text>

  <!-- AI Validation Layer -->
  <rect x="268" y="290" width="220" height="44" rx="22" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="1"/>
  <text x="378" y="317" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">AI Validation &amp; Compliance</text>

  <!-- Arrow Design Studio ↔ AI -->
  <line x1="378" y1="270" x2="378" y2="290" stroke="#2563eb" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- Arrow Design Studio → SDR -->
  <line x1="508" y1="195" x2="590" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Single Source of Truth Box -->
  <rect x="598" y="140" width="200" height="110" rx="12" fill="#1a1a1a" opacity="0.04" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="618" y="155" width="160" height="32" rx="6" fill="#1a1a1a"/>
  <text x="698" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Single Source of Truth</text>
  <text x="698" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">SDR</text>
  <text x="698" y="228" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#888" text-anchor="middle">Study Data Repository</text>

  <!-- Arrow SDR → Formatted Output -->
  <line x1="798" y1="195" x2="870" y2="195" stroke="#999" marker-end="url(#arr)"/>

  <!-- Right: Outputs -->
  <text x="990" y="90" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#999" text-anchor="middle" letter-spacing="1">OUTPUTS</text>

  <rect x="878" y="108" width="180" height="44" rx="8" fill="white" stroke="#d4d4d4"/>
  <text x="968" y="135" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">Formatted SoA Table</text>

  <rect x="878" y="164" width="180" height="44" rx="8" fill="white" stroke="#d4d4d4"/>
  <text x="968" y="191" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">Protocol Narrative</text>

  <rect x="878" y="220" width="180" height="44" rx="8" fill="white" stroke="#d4d4d4"/>
  <text x="968" y="247" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1a1a1a" text-anchor="middle">CLS RFP Document</text>

  <!-- Downstream -->
  <rect x="878" y="290" width="180" height="44" rx="8" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="968" y="317" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#888" text-anchor="middle">Downstream Systems</text>

  <!-- Arrow to downstream -->
  <line x1="698" y1="250" x2="698" y2="360" stroke="#999" stroke-dasharray="4 3"/>
  <line x1="698" y1="360" x2="870" y2="312" stroke="#999" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Bottom: Roles -->
  <text x="600" y="410" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#999" text-anchor="middle" letter-spacing="1">COLLABORATIVE ROLES</text>

  <!-- Role badges -->
  <rect x="300" y="428" width="140" height="32" rx="16" fill="white" stroke="#d4d4d4"/>
  <circle cx="322" cy="444" r="8" fill="#2563eb" opacity="0.15"/>
  <text x="318" y="448" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">👤</text>
  <text x="385" y="449" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#1a1a1a" text-anchor="middle">Clinical Designer</text>

  <rect x="460" y="428" width="140" height="32" rx="16" fill="white" stroke="#d4d4d4"/>
  <circle cx="482" cy="444" r="8" fill="#c4001d" opacity="0.15"/>
  <text x="478" y="448" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#c4001d" text-anchor="middle">👤</text>
  <text x="545" y="449" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#1a1a1a" text-anchor="middle">Medical Writer</text>

  <rect x="620" y="428" width="140" height="32" rx="16" fill="white" stroke="#d4d4d4"/>
  <circle cx="642" cy="444" r="8" fill="#059669" opacity="0.15"/>
  <text x="638" y="448" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#059669" text-anchor="middle">👤</text>
  <text x="705" y="449" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#1a1a1a" text-anchor="middle">Study Lead</text>

  <!-- Dashed lines from roles to Design Studio -->
  <line x1="370" y1="428" x2="350" y2="270" stroke="#ddd" stroke-dasharray="3 3"/>
  <line x1="530" y1="428" x2="400" y2="270" stroke="#ddd" stroke-dasharray="3 3"/>
  <line x1="690" y1="428" x2="698" y2="250" stroke="#ddd" stroke-dasharray="3 3"/>
</svg>
