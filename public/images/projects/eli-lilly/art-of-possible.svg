<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 545" fill="none">
  <style>
    .node { fill: #f7f6f3; stroke: #d0cdc8; stroke-width: 1.5; rx: 10; }
    .node-start { fill: #EFEDE8; stroke: #D0CCC6; stroke-width: 1.5; rx: 10; }
    .node-end { fill: #E0DDD6; stroke: #C4C0B8; stroke-width: 1.5; rx: 10; }
    .node-success { fill: #E8E5DE; stroke: #C8C4BC; stroke-width: 1.5; rx: 10; }
    .label { font-family: Inter, sans-serif; font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
    .label-sm { font-family: Inter, sans-serif; font-size: 10.5px; fill: #888; text-anchor: middle; }
    .label-bold { font-family: Inter, sans-serif; font-size: 13px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
    .arrow-loop { stroke: #c4756e; stroke-width: 1.2; fill: none; marker-end: url(#arrowred); stroke-dasharray: 4 3; }
    .loop-label { font-family: Inter, sans-serif; font-size: 10.5px; fill: #c4756e; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#999"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c4756e"/>
    </marker>
  </defs>

  <!-- Step 1: Dashboard -->
  <rect class="node-start" x="460" y="80" width="280" height="48"/>
  <text class="label-bold" x="600" y="109">Writer opens Dashboard</text>

  <line class="arrow" x1="600" y1="128" x2="600" y2="180"/>

  <!-- Step 2: Writer Edits SOA -->
  <rect class="node" x="420" y="180" width="360" height="56"/>
  <text class="label-bold" x="600" y="205">Writer edits SOA</text>
  <text class="label-sm" x="600" y="222">Structured editing · Comments · Change tracking</text>

  <line class="arrow" x1="600" y1="236" x2="600" y2="300"/>

  <!-- Step 3: Designer Reviews -->
  <rect class="node" x="420" y="300" width="360" height="56"/>
  <text class="label-bold" x="600" y="325">Designer reviews SOA</text>
  <text class="label-sm" x="600" y="342">Comments only — no direct edits</text>

  <!-- Feedback loop: Designer → Writer -->
  <line class="arrow-loop" x1="420" y1="328" x2="320" y2="328"/>
  <line class="arrow-loop" x1="320" y1="328" x2="320" y2="208"/>
  <line class="arrow-loop" x1="320" y1="208" x2="420" y2="208"/>
  <text class="loop-label" x="310" y="272">Changes needed</text>

  <line class="arrow" x1="600" y1="356" x2="600" y2="420"/>

  <!-- Step 4: Study Team Approves -->
  <rect class="node-success" x="440" y="420" width="320" height="48"/>
  <text class="label-bold" x="600" y="449">Study Team approves</text>

  <line class="arrow" x1="600" y1="468" x2="600" y2="530"/>

  <!-- Step 5: Auto-sync -->
  <rect class="node-end" x="440" y="530" width="320" height="56"/>
  <text class="label" x="600" y="554">Auto-sync to</text>
  <text class="label-bold" x="600" y="572">Design Studio ✓</text>
</svg>
