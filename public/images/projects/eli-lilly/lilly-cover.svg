  <!-- Comment bubble 1 -->
  <rect x="970" y="60" width="220" height="70" rx="8" fill="#1a1a1a" opacity="0.02"/>
  <circle cx="990" cy="80" r="10" fill="#d32f2f" opacity="0.06"/>
  <rect x="1008" y="76" width="80" height="6" rx="3" fill="#1a1a1a" opacity="0.05"/>
  <rect x="1008" y="88" width="150" height="5" rx="2.5" fill="#1a1a1a" opacity="0.03"/>
  <rect x="1008" y="100" width="120" height="5" rx="2.5" fill="#1a1a1a" opacity="0.03"/>
  <!-- Comment bubble 2 -->
  <rect x="970" y="145" width="220" height="70" rx="8" fill="#1a1a1a" opacity="0.02"/>
  <circle cx="990" cy="165" r="10" fill="#3b82f6" opacity="0.06"/>
