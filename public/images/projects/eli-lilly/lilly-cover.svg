  <circle cx="314" cy="28" r="8" fill="#1a1a1a" opacity="0.04"/>
  <circle cx="338" cy="28" r="8" fill="#1a1a1a" opacity="0.04"/>
  <rect x="370" y="22" width="1" height="12" fill="#1a1a1a" opacity="0.06"/>
