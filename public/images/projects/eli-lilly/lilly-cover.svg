  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#1a1a1a" opacity="0.6" letter-spacing="0.5">Writer&apos;s Studio</text>
  <text x="600" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#d32f2f" opacity="0.4" letter-spacing="2">Clinical Trial Protocol Platform</text>
